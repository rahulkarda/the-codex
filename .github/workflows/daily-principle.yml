name: Daily principle (Gemini)

on:
  schedule:
    # 11am IST target (-2hr buffer) = 9am IST = 03:30 UTC
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-principle
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate one new principle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/daily-principle.js

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain data/principles.json)" ]]; then
            echo "No change — exiting."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          NAME=$(node -e "const d=require('./data/principles.json');console.log(d.meta?.lastAdded?.name||'new entry')")
          git config user.name 'codex-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/principles.json
          git commit -m "🌱 daily: ${NAME} (${DATE})"
          git push
